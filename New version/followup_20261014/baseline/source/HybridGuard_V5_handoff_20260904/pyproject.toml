[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-guard-experiment"
version = "0.3.0"
description = "StructuralGuard, FormulaGuard V5, and group-aware HybridGuard experiment"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1", "numpy>=1.26"]

[project.scripts]
hybridguard-run = "hybridguard.runner:main"
hybridguard-hierarchical = "hybridguard.runner_hierarchical:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["hybridguard", "structuralguard", "formulaguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
